spring:
  profiles:
    active: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:acg_test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  security:
    user:
      name: admin
      password: admin123
  autoconfigure:
    exclude:
      - org.redisson.spring.boot.autoconfigure.RedissonAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: localhost:9876

token:
  secret: test_secret_key_for_jwt_testing_12345678
  expireTime: 1440

logging:
  level:
    com.ruoyi: DEBUG
    org.springframework.security: WARN
