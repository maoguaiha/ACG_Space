name: ACG Space CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ====== 代码质量检查 ======
  code-quality:
    name: Code Quality (Checkstyle + SpotBugs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: SpotBugs Static Analysis
        run: mvn spotbugs:check -B
        continue-on-error: true  # 不阻断 CI，仅报告

  # ====== 编译 + 单元测试 ======
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest
    needs: code-quality
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile -B

      - name: Run Tests
        run: mvn test -B

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/target/surefire-reports/

  # ====== 构建 Docker 镜像 ======
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Dockerfile 期望 backend/target/*.jar 已存在（'宿主机预构建'），
      # 而 mvn compile/test 不打 jar，必须显式跑 mvn package。
      - name: Build JAR (mvn package)
        run: mvn package -B -DskipTests

      - name: Build Docker Image
        run: docker build -t acg-space-backend:latest ./backend

      - name: Verify Image
        run: docker images | grep acg-space-backend
