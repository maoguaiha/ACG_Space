services:
  # 0. Backend 应用服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acg_backend
    ports:
      - "18083:18083"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: acg_space
      DB_USER: root
      DB_PWD: "123456"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROCKETMQ_NAMESRV: rmqnamesrv:9876
      TOKEN_SECRET: acgspace_production_secret_change_me_2026
      TOKEN_EXPIRE: "1440"
      SPRING_PROFILES_ACTIVE: dev
      AGENT_API_BASE_URL: http://python-agent:8000
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      rmqnamesrv:
        condition: service_started
      rmqbroker:
        condition: service_started
    restart: unless-stopped

  # 1. MySQL 服务 (自带建表)
  mysql:
    image: mysql:8.0
    container_name: acg_mysql
    ports:
      - "13306:3306"  # 宿主机端口；3306 被 Windows 动态保留范围(3272-3371)占用，改映射到 13306
    environment:
      MYSQL_ROOT_PASSWORD: "123456" # 与 application-dev.yml 中的密码强对应
      MYSQL_DATABASE: "acg_space"   # Docker 会在首次启动时自动创建此库
      TZ: Asia/Shanghai
    volumes:
      # 合并后的单文件初始化脚本（schema + V2.1 完整业务表 + V2.2 补列 + 测试数据，全程 IF NOT EXISTS 幂等）
      # 仅在数据卷为空（首次初始化）时由 MySQL 自动执行一次；存量库请手动执行 ACG_Space_upgrade.sql 补齐
      - ./backend/sql/ACG_Space_init.sql:/docker-entrypoint-initdb.d/01-init.sql
      # 命名数据卷：避免 docker compose down/up 重建时丢失业务数据（原匿名卷易丢失）
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 2. Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: acg_redis
    ports:
      - "6379:6379"

  # 3. RocketMQ NameServer (路由中心)
  rmqnamesrv:
    image: apache/rocketmq:5.2.0
    container_name: acg_rmqnamesrv
    ports:
      - "9876:9876"
    command: nameserver

  # 4. RocketMQ Broker (消息存储与转发)
  rmqbroker:
    image: apache/rocketmq:5.2.0
    container_name: acg_rmqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    depends_on:
      - rmqnamesrv
    volumes:
      # 挂载自定义配置文件，解决宿主机与 Docker 网络无法通信的经典大坑
      - ./broker.conf:/home/rocketmq/rocketmq-5.2.0/conf/broker.conf
    command: broker -n rmqnamesrv:9876 -c /home/rocketmq/rocketmq-5.2.0/conf/broker.conf

  # 5. Python Agent 服务（AI 助手大脑，无状态，被 backend 门面代理调用）
  python-agent:
    build:
      context: ./python-agent
      dockerfile: Dockerfile
    container_name: acg_python_agent
    ports:
      - "8000:8000"
    env_file:
      # 单一事实来源：python-agent/.env 已含 Chat(LongCat) / Embed(通义) / Bangumi / Port 全部配置。
      # 注意：compose 中 environment 优先级高于 env_file，故此处不再用 environment 设 LLM_*，
      # 否则 ${VAR:-deepseek默认值} 会覆盖 .env 的 LongCat 配置（之前踩过的坑）。
      - ./python-agent/.env
    volumes:
      # 知识库热更新：改 python-agent/corpus/ 后只需对容器调 POST /rebuild，无需重建镜像
      - ./python-agent/corpus:/app/corpus:ro
    restart: unless-stopped

# 命名数据卷：业务数据落在此卷，docker compose down/up 重建容器不会丢失；
# 注意仅 docker compose down -v 才会删除（仍会清，但命名卷不会被 docker volume prune 误清）。
volumes:
  mysql_data:
    name: acg_mysql_data
    external: true

